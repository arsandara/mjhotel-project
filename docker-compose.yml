services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/uploads.ini  # TAMBAH INI DI SINI
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mjhotel_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_hotelmj
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  db_data:  # INI TETEP DI SINI (untuk MySQL data)